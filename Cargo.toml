[package]
name = "rdh"
# The public zero-padded CalVer is read from VERSION because it is not SemVer.
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"
description = "Portable R environment for database work"

[dependencies]

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
