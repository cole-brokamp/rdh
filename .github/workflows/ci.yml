name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install static-check tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq r-base-core ripgrep
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Test Rust CLI
        run: cargo test --locked
      - name: Run repository checks
        run: |
          cargo build --locked
          bash tests/test-static.sh
          bash tests/test-cli.sh target/debug/rdh
          bash tests/test-installer.sh target/debug/rdh
          bash tests/test-release-packaging.sh target/debug/rdh

  native-builds:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Build native executable
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Exercise executable
        run: "target/${{ matrix.target }}/release/rdh version"
